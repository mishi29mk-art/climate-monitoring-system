<script>lucide.createIcons();</script>
<script>
(function(){
    var timeEl = document.getElementById('dc-time');
    var ampmEl = document.getElementById('dc-ampm');
    var dateEl = document.getElementById('dc-date');
    if (!timeEl) return;
    var days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    function tick() {
        var now = new Date();
        var pk = new Date(now.toLocaleString('en-US', {timeZone:'Asia/Karachi'}));
        var h = pk.getHours();
        var m = String(pk.getMinutes()).padStart(2, '0');
        var s = String(pk.getSeconds()).padStart(2, '0');
        var ampm = h >= 12 ? 'PM' : 'AM';
        var h12 = h % 12 || 12;
        timeEl.textContent = h12 + ':' + m + ':' + s;
        ampmEl.textContent = ampm;
        dateEl.textContent = days[pk.getDay()] + ', ' + pk.getDate() + ' ' + months[pk.getMonth()] + ', ' + pk.getFullYear();
    }
    tick();
    setInterval(tick, 1000);
})();
</script>
